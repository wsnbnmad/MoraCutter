name: Build Windows candidates

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            architecture: x64
          - runner: windows-11-arm
            architecture: ARM64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Select native Python
        shell: pwsh
        run: |
          python -c "import platform; print(platform.machine())"
      - name: Build and test unsigned candidate
        shell: pwsh
        run: |
          ./build_windows.ps1 -Python python -Architecture "${{ matrix.architecture }}"
      - name: Upload candidate for local signing
        uses: actions/upload-artifact@v4
        with:
          name: MoraCutter-v1.0.1-Windows-${{ matrix.architecture }}-unsigned
          path: release/MoraCutter-v1.0.1-Windows-${{ matrix.architecture }}/
          if-no-files-found: error
